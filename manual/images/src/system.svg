<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5282"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Yu Gothic UI','Meiryo',sans-serif; fill:#1a202c; }
    .t  { font-size:15px; font-weight:bold; }
    .s  { font-size:12px; fill:#4a5568; }
    .l  { font-size:12px; fill:#2c5282; }
    .lo { font-size:12px; fill:#b7791f; }
    .box{ fill:#ffffff; stroke:#2c5282; stroke-width:2; rx:8; }
    .own{ fill:#ebf4ff; stroke:#2c5282; stroke-width:2.5; rx:8; }
    .ext{ fill:#f7fafc; stroke:#a0aec0; stroke-width:2; rx:8; }
    .grp{ fill:none; stroke:#2c5282; stroke-width:1.5; stroke-dasharray:6 4; rx:12; }
  </style>

  <rect class="grp" x="14" y="18" width="360" height="226"/>
  <text class="s" x="24" y="40">このマニュアルが説明する範囲（ローカル版）</text>

  <rect class="own" x="40" y="58" width="300" height="70"/>
  <text class="t" x="60" y="86">ダッシュボード</text>
  <text class="s" x="60" y="108">戦略の登録・調整・バックテスト・記録の確認</text>

  <rect class="own" x="40" y="162" width="300" height="70"/>
  <text class="t" x="60" y="190">ローカルエンジン</text>
  <text class="s" x="60" y="212">ろうそく足を作り、戦略を1本ずつ動かす</text>

  <line x1="190" y1="128" x2="190" y2="158" stroke="#2c5282" stroke-width="2" marker-end="url(#a)"/>
  <text class="l" x="200" y="150">制御・状態表示</text>

  <rect class="ext" x="470" y="110" width="200" height="70"/>
  <text class="t" x="490" y="138">ブリッジ</text>
  <text class="s" x="490" y="160">別製品（発注はここが行う）</text>

  <rect class="ext" x="740" y="110" width="180" height="70"/>
  <text class="t" x="760" y="138">kabuステーション</text>
  <text class="s" x="760" y="160">証券会社の取引ソフト</text>

  <line x1="342" y1="176" x2="466" y2="148" stroke="#2c5282" stroke-width="2" marker-end="url(#a)"/>
  <text class="l" x="388" y="96">シグナル（Webhook・ポート 8001）</text>

  <line x1="466" y1="188" x2="342" y2="214" stroke="#b7791f" stroke-width="2" marker-end="url(#b)"/>
  <text class="lo" x="392" y="270">値段（tick・ポート 5000）</text>

  <line x1="670" y1="145" x2="736" y2="145" stroke="#2c5282" stroke-width="2" marker-end="url(#a)"/>

  <rect class="ext" x="740" y="240" width="180" height="60"/>
  <text class="t" x="760" y="268">大阪取引所</text>
  <text class="s" x="760" y="288">日経225先物</text>
  <line x1="830" y1="180" x2="830" y2="236" stroke="#2c5282" stroke-width="2" marker-end="url(#a)"/>

  <text class="s" x="40" y="300">・エンジンは「いつ・どちらに・何枚」を決めるところまでを受け持ちます。</text>
  <text class="s" x="40" y="324">・実際の発注（値段の指定・注文の管理）はブリッジが行います。</text>
  <text class="s" x="40" y="348">・ブリッジの操作は別冊「N225 ブリッジ 操作マニュアル」をご覧ください。</text>
  <text class="s" x="40" y="372">・ローソク足は、ブリッジから届く日経225ミニの値段から、エンジンが自分で作ります。</text>
</svg>
